# Both environments share provider budgets, but authenticate with different host-bound tokens.
server {
    listen 443 ssl;
    server_name pobook-api-testfligh.fpmaps.com pobook-api.fpmaps.com;
    ssl_certificate /etc/letsencrypt/live/pobook-api.fpmaps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pobook-api.fpmaps.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    large_client_header_buffers 4 16k;
    access_log off;
    error_log /dev/null crit;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $pobook_upstream http://pobook-api-dev:3000;
        proxy_pass $pobook_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}
