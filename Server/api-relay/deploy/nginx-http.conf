# Insert inside the existing http {}. Keep this ACME location after enabling HTTPS.
server {
    listen 80;
    server_name pobook-api-dev.fpmaps.com;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / { return 308 https://pobook-api-dev.fpmaps.com$request_uri; }
}
