# Insert inside http {}. One certificate covers both explicitly listed API hosts.
server {
    listen 80;
    server_name pobook-api-testfligh.fpmaps.com pobook-api.fpmaps.com;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}
